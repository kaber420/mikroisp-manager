{% extends "base.html" %}

{% block title %}Manage Switches - µMonitor Pro{% endblock %}

{% block content %}
<main class="flex-1 p-6 lg:p-8">
    <!-- Header & Actions -->
    <div class="flex items-center justify-between mb-8" x-data="switchList()">
        <h1 class="text-4xl font-bold">Manage MikroTik Switches</h1>
        <div class="flex gap-3">
            <button @click="openSwitchModal()"
                class="flex items-center justify-center h-10 px-4 text-sm font-bold text-white rounded-lg bg-primary hover:bg-primary-hover shadow-lg shadow-primary/20 transition-all duration-200">
                <span class="material-symbols-outlined mr-2">add</span>
                <span>Add New Switch</span>
            </button>
        </div>
    </div>

    <!-- Switch List Card -->
    <div class="glass-card rounded-2xl border-0" x-data="switchList()">
        <div class="px-6 py-4 border-b border-white/10 flex flex-wrap gap-4 items-center justify-between bg-white/5">
            <h2 class="text-xl font-bold text-white">Switches</h2>

            <div class="flex flex-wrap items-center gap-4">
                <!-- Status Filter Buttons -->
                <div
                    class="flex flex-wrap gap-1 bg-surface-1/50 backdrop-blur-sm p-1 rounded-lg border border-white/10">
                    <button @click="statusFilter = 'all'"
                        :class="{'bg-primary text-white shadow-lg shadow-primary/20': statusFilter === 'all', 'text-text-secondary hover:text-white hover:bg-white/5': statusFilter !== 'all'}"
                        class="px-3 py-1 text-xs font-semibold rounded-md transition-all duration-200">All</button>
                    <button @click="statusFilter = 'online'"
                        :class="{'bg-success text-white shadow-lg shadow-success/20': statusFilter === 'online', 'text-text-secondary hover:text-white hover:bg-white/5': statusFilter !== 'online'}"
                        class="px-3 py-1 text-xs font-semibold rounded-md transition-all duration-200">Online</button>
                    <button @click="statusFilter = 'offline'"
                        :class="{'bg-danger text-white shadow-lg shadow-danger/20': statusFilter === 'offline', 'text-text-secondary hover:text-white hover:bg-white/5': statusFilter !== 'offline'}"
                        class="px-3 py-1 text-xs font-semibold rounded-md transition-all duration-200">Offline</button>
                </div>

                <!-- Search -->
                <div class="relative">
                    <span
                        class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-lg">search</span>
                    <input type="text" x-model.debounce.300ms="searchQuery" placeholder="Search..."
                        class="w-full sm:w-64 pl-10 pr-4 py-2 input-glass rounded-lg">
                </div>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full text-sm">
                <thead class="bg-white/5">
                    <tr>
                        <th
                            class="px-6 py-3 text-left text-xs font-semibold text-text-secondary uppercase tracking-wider">
                            Status</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-semibold text-text-secondary uppercase tracking-wider">
                            Hostname</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-semibold text-text-secondary uppercase tracking-wider">
                            Host (IP)</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-semibold text-text-secondary uppercase tracking-wider">
                            Zone</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-semibold text-text-secondary uppercase tracking-wider">
                            Model / Firmware</th>
                        <th
                            class="px-6 py-3 text-left text-xs font-semibold text-text-secondary uppercase tracking-wider">
                            Location</th>
                        <th
                            class="px-6 py-3 text-center text-xs font-semibold text-text-secondary uppercase tracking-wider">
                            Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-white/5">
                    <template x-if="isLoading">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-text-secondary">Loading switches...</td>
                        </tr>
                    </template>
                    <template x-if="!isLoading && switches.length === 0">
                        <tr>
                            <td colspan="7" class="p-8 text-center text-text-secondary">No switches found matching
                                your criteria.</td>
                        </tr>
                    </template>
                    <template x-for="sw in switches" :key="sw.host">
                        <tr @click="goToDetails(sw.host)"
                            class="hover:bg-surface-2 transition-colors duration-200 cursor-pointer">
                            <td class="px-6 py-4 whitespace-nowrap">
                                <div :class="{
                                        'text-success': sw.last_status === 'online',
                                        'text-danger': sw.last_status === 'offline',
                                        'text-text-secondary': sw.last_status !== 'online' && sw.last_status !== 'offline'
                                    }" class="flex items-center gap-2">
                                    <div class="size-2 rounded-full" :class="{
                                            'bg-success': sw.last_status === 'online',
                                            'bg-danger': sw.last_status === 'offline',
                                            'bg-text-secondary': sw.last_status !== 'online' && sw.last_status !== 'offline'
                                        }"></div>
                                    <span x-text="sw.last_status || 'Unknown'"></span>
                                </div>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap font-semibold text-text-primary">
                                <a :href="`/switch/${encodeURIComponent(sw.host)}`"
                                    class="hover:text-primary hover:underline" x-text="sw.hostname || 'N/A'"></a>
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-text-secondary font-mono" x-text="sw.host">
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-text-secondary"
                                x-text="getZoneName(sw.zona_id)"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-text-secondary"
                                x-text="`${sw.model || 'N/A'} / ${sw.firmware || 'N/A'}`"></td>
                            <td class="px-6 py-4 whitespace-nowrap text-text-secondary" x-text="sw.location || '-'">
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-center space-x-2">
                                <button @click.stop="testConnection(sw)" class="text-text-secondary hover:text-success"
                                    title="Test Connection">
                                    <span class="material-symbols-outlined">network_check</span>
                                </button>
                                <button @click.stop="openSwitchModal(sw)" class="text-text-secondary hover:text-primary"
                                    title="Edit Switch">
                                    <span class="material-symbols-outlined">edit</span>
                                </button>
                                <button @click.stop="deleteSwitch(sw.host, sw.hostname)"
                                    class="text-text-secondary hover:text-danger" title="Delete Switch">
                                    <span class="material-symbols-outlined">delete</span>
                                </button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Switch Modal Template - Used by ModalUtils.showCustomModal -->
    <template id="switch-modal-template">
        <div x-data="switchModal()">
            <form @submit.prevent="save()">
                <div class="max-h-[70vh] overflow-y-auto space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="switch-host" class="block text-sm font-medium mb-1">Host (IP Address)</label>
                            <input type="text" id="switch-host" x-model="currentSwitch.host" :disabled="isEditing"
                                required class="w-full bg-background border border-border-color rounded-md p-2"
                                :class="{'bg-surface-2 cursor-not-allowed': isEditing}">
                        </div>
                        <div>
                            <label for="switch-zona_id" class="block text-sm font-medium mb-1">Zone</label>
                            <select id="switch-zona_id" x-model="currentSwitch.zona_id"
                                class="w-full bg-background border border-border-color rounded-md p-2">
                                <option value="">Select a zone (optional)...</option>
                                <template x-for="zone in allZones" :key="zone.id">
                                    <option :value="zone.id" x-text="zone.nombre"></option>
                                </template>
                            </select>
                        </div>
                        <div>
                            <label for="switch-api_port" class="block text-sm font-medium mb-1">API Port</label>
                            <input type="number" id="switch-api_port" x-model.number="currentSwitch.api_port" required
                                class="w-full bg-background border border-border-color rounded-md p-2">
                        </div>
                        <div>
                            <label for="switch-ssh_port" class="block text-sm font-medium mb-1">SSH Port</label>
                            <input type="number" id="switch-ssh_port" x-model.number="currentSwitch.ssh_port" required
                                class="w-full bg-background border border-border-color rounded-md p-2">
                        </div>
                        <div>
                            <label for="switch-location" class="block text-sm font-medium mb-1">Location</label>
                            <input type="text" id="switch-location" x-model="currentSwitch.location"
                                placeholder="e.g., Server Room, Building A"
                                class="w-full bg-background border border-border-color rounded-md p-2">
                        </div>
                    </div>

                    <div>
                        <h4 class="text-md font-semibold text-text-primary"
                            x-text="isEditing && currentSwitch.is_provisioned ? 'Credenciales API (Actuales)' : 'Credenciales del Dispositivo'">
                        </h4>
                        <p class="text-xs text-text-secondary mb-2"
                            x-text="isEditing && currentSwitch.is_provisioned ? 'Credenciales usadas para la conexión API segura.' : 'Credenciales actuales del dispositivo.'">
                        </p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                            <div>
                                <label for="switch-username" class="block text-sm font-medium mb-1">Username</label>
                                <input type="text" id="switch-username" x-model="currentSwitch.username" required
                                    class="w-full bg-background border border-border-color rounded-md p-2">
                            </div>
                            <div>
                                <label for="switch-password" class="block text-sm font-medium mb-1">Password</label>
                                <input type="password" id="switch-password" x-model="currentSwitch.password"
                                    :placeholder="isEditing ? 'Leave blank to keep current' : ''" :required="!isEditing"
                                    class="w-full bg-background border border-border-color rounded-md p-2">
                            </div>
                        </div>
                    </div>

                    <!-- Master Credentials - only visible for provisioned devices -->
                    <div x-show="isEditing && currentSwitch.is_provisioned" x-transition>
                        <h4 class="text-md font-semibold text-text-primary">Credenciales Master (Originales)</h4>
                        <p class="text-xs text-text-secondary mb-2">Credenciales originales guardadas durante el
                            aprovisionamiento.</p>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                            <div>
                                <label for="switch-master_username" class="block text-sm font-medium mb-1">Master
                                    Username</label>
                                <input type="text" id="switch-master_username" x-model="currentSwitch.master_username"
                                    class="w-full bg-background border border-border-color rounded-md p-2">
                            </div>
                            <div>
                                <label for="switch-master_password" class="block text-sm font-medium mb-1">Master
                                    Password</label>
                                <input type="password" id="switch-master_password"
                                    x-model="currentSwitch.master_password" placeholder="Leave blank to keep current"
                                    class="w-full bg-background border border-border-color rounded-md p-2">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label for="switch-notes" class="block text-sm font-medium mb-1">Notes</label>
                        <textarea id="switch-notes" x-model="currentSwitch.notes" rows="2"
                            placeholder="Optional notes about this switch..."
                            class="w-full bg-background border border-border-color rounded-md p-2"></textarea>
                    </div>

                    <div x-show="error" x-text="error" class="text-danger text-sm"></div>
                </div>

                <!-- Security Actions -->
                <div x-show="isEditing" class="pt-4 border-t border-border-color mt-6">
                    <h4 class="text-md font-semibold text-text-primary mb-2">Security Actions</h4>
                    <div class="bg-surface-2 p-4 rounded-lg flex items-center justify-between">
                        <div>
                            <p class="text-sm font-medium text-text-primary">SSL Certificate</p>
                            <p class="text-xs text-text-secondary">Update or repair the secure connection certificate.
                            </p>
                        </div>
                        <div class="flex gap-2">
                            <button type="button" @click="renewSSL()"
                                class="px-3 py-1.5 text-xs font-semibold rounded bg-primary/20 text-primary hover:bg-primary/30 border border-primary/20 flex items-center gap-1">
                                <span class="material-symbols-outlined text-sm">sync_lock</span>
                                Renovar SSL
                            </button>
                            <button type="button" @click="unlinkSwitch()"
                                class="px-3 py-1.5 text-xs font-semibold rounded bg-warning/20 text-warning hover:bg-warning/30 border border-warning/20 flex items-center gap-1">
                                <span class="material-symbols-outlined text-sm">link_off</span>
                                Desvincular
                            </button>
                        </div>
                    </div>
                </div>

            </form>
        </div>
    </template>
</main>
{% endblock %}

{% block scripts %}
<script nonce="{{ request.state.csp_nonce }}" src="/static/js/utils/ssl_actions.js" defer></script>
<script nonce="{{ request.state.csp_nonce }}" src="/static/js/stores/SwitchStore.js" defer></script>
<script nonce="{{ request.state.csp_nonce }}" src="/static/js/components/switches/SwitchList.js" defer></script>
<script nonce="{{ request.state.csp_nonce }}" src="/static/js/components/switches/SwitchModal.js" defer></script>
{% endblock %}
